Scalability`,difficulty:`Intermediate`,question:`A photo-sharing service experiences sudden 10x traffic spikes during product launches. The database writes are locking the user table and increasing p99 latency to 4.2 seconds. Which architectural pattern should be implemented first?`,options:[`Replace PostgreSQL with an unindexed flat file storage on AWS S3`,`Introduce an asynchronous message broker (Kafka/RabbitMQ) with worker pools and write-back caching`,`Increase the client-side HTTP polling frequency to 100ms to distribute requests`,`Vertically upgrade the database RAM while keeping synchronous blocking write queries`],correctIndex:1,explanation:`Decoupling heavy writes using an asynchronous queue (like Kafka or RabbitMQ) ensures immediate client acknowledgment while background workers process writes systematically, safeguarding the primary database from sudden connection exhaustion.`},{id:`q-2`,type:`code`,category:`Cloud & Containerization`,difficulty:`Intermediate`,question:`Analyze the following Dockerfile snippet. Which line poses the most critical security and performance vulnerability for production deployments?`,codeSnippet:`FROM node:20-alpine
WORKDIR /app
COPY . .
RUN npm install
USER root
EXPOSE 3000
CMD ["npm", "start"]`,options:[`Using alpine base image node:20-alpine instead of ubuntu`,`Running as USER root and doing COPY . . before npm install (breaking layer cache and running as superuser)`,`Exposing port 3000 instead of standard HTTPS port 443`,`Invoking CMD ["npm", "start"] instead of direct node execution`],correctIndex:1,explanation:`Running the container process as "root" creates significant security vulnerabilities if escaped. Furthermore, copying the entire directory before "npm install" invalidates Docker layer cache on every code change, drastically slowing build times.`},{id:`q-3`,type:`mcq`,category:`Distributed Systems`,difficulty:`Advanced`,question:`In the context of the CAP theorem and distributed databases, what guarantees does a system provide when it prioritizes Consistency and Partition Tolerance (CP) during a network partition?`,options:[`Every non-failing node returns a response, even if the data is stale`,`The system rejects writes or returns errors to avoid serving divergent or out-of-sync state across partitions`,`Network partitions never occur because fiber-optic links are redundancy-locked`,`Reads are always routed to the closest edge CDN regardless of replication consensus`],correctIndex:1,explanation:`A CP system prioritizes atomic consistency over availability. When a partition occurs, it stops accepting writes or reading from segregated nodes until consensus is restored, preventing split-brain state.`},{id:`q-4`,type:`scenario`,category:`Database Architecture`,difficulty:`Intermediate`,question:'Your SQL query `SELECT * FROM orders WHERE user_id = 4920 AND status = "shipped" ORDER BY created_at DESC;` is doing a sequential table scan across 12M rows. What composite index provides optimal performance?',options:[`CREATE INDEX idx_orders ON orders (status);`,`CREATE INDEX idx_orders ON orders (user_id, status, created_at DESC);`,`CREATE INDEX idx_orders ON orders (created_at DESC);`,`CREATE INDEX idx_orders ON orders (id, user_id);`],correctIndex:1,explanation:`A composite index matching the equality filters first (user_id, status) followed by the ordering column (created_at DESC) allows the database engine to perform an index seek and return rows in pre-sorted order without costly memory sorting.`}],S=[{id:`rq-1`,type:`mcq`,category:`Docker Orchestration & Rate Limiting`,difficulty:`Intermediate`,question:`Which HTTP header should an API gateway return when a client exceeds its permitted token rate limit under RFC 6585?`,options:[`403 Forbidden with Retry-After`,`429 Too Many Requests with Retry-After`,`503 Service Unavailable with RateLimit-Reset`,`400 Bad Request with RateLimit-Remaining: 0`],correctIndex:1,explanation:`HTTP status code 429 (Too Many Requests) combined with the Retry-After header indicates the client has sent too many requests in a given amount of time and specifies when to retry.`},{id:`rq-2`,type:`scenario`,category:`Docker Multi-Stage Optimization`,difficulty:`Intermediate`,question:`To minimize the final production container footprint for a Next.js application, which technique yields the highest size reduction?`,options:[`Keep devDependencies in the final container image for runtime patching`,"Use multi-stage builds and copy only the standalone `.next/standalone` directory and static assets into a minimal node:alpine runner",`Compress the Docker container tarball with gzip before running it`,`Run the application directly inside Docker without Node.js runtime installed`],correctIndex:1,explanation:`Next.js standalone output isolates only the production dependencies and built files, reducing Docker image size from ~1.2 GB down to under ~95 MB.`},{id:`rq-3`,type:`code`,category:`Redis Distributed Caching`,difficulty:`Intermediate`,question:`What is the primary danger of setting an identical expiration time (TTL) of 3600 seconds on millions of cached user session keys?`,options:[`Cache Stampede / Cache Avalanche when all keys expire simultaneously, overwhelming the database`,`Redis runs out of CPU cycles by attempting to serialize memory addresses`,`The operating system TCP stack drops outbound socket packets`,`Clients will be forcibly logged out with HTTP 404`],correctIndex:0,explanation:`A Cache Avalanche occurs when multiple cached items expire simultaneously, triggering a deluge of cache-miss queries directly against the backend database. Adding random jitter to TTL values mitigates this.`}],C={recordedAt:`2026-09-02T14:30:00Z`,durationSeconds:48,transcript:`In my recent distributed systems capstone project, we faced a major bottleneck where concurrent WebSocket connections were degrading Postgres throughput. I proposed decoupling the real-time event streaming using Redis Pub/Sub, while implementing worker threads to batch write updates every 500 milliseconds. This reduced CPU utilization by 42% and brought p95 latency under 80ms.`,overallScore:82,metrics:{paceWpm:136,paceStatus:`Optimal`,pauseCount:4,pauseStatus:`Natural`,fillerWordsCount:2,fillerWordsDetected:[`um`,`like`],pitchModulationScore:84,toneConfidenceScore:86},strengths:[`Excellent pacing: 136 words/min falls cleanly in the optimal 130–150 professional presentation zone.`,`Structured STAR delivery: Clearly framed Situation, Task, Action (Redis Pub/Sub), and quantitative Result (42% CPU reduction).`,`Crisp technical terminology and assertive, confident vocal projection.`],improvements:[`Slight hesitation before articulating "Postgres throughput" — practice transition phrasing.`,`Work on breathing pauses between the technical problem statement and the architectural solution.`],aiActionableAdvice:`Your technical clarity is outstanding! To reach the top 5% executive presence tier, replace the 1-second filler "um" with an intentional 0.8-second silent pause. Silence conveys mastery and gives recruiters time to absorb your architectural metrics.`},te=[{id:`opp-1`,title:`Full Stack Cloud Engineering Intern`,company:`Nexora Technologies`,companyLogo:`https://images.unsplash.
