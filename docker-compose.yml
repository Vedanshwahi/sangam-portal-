services:
  sangam-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sangam-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/backend/data/sangam.db
    volumes:
      - sangam-data:/app/backend/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sangam-data:
    driver: local
